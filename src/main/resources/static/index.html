<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PokeAPI</title>
    <link rel="stylesheet" href="styles.css">
    <script src="script.js" defer></script>
</head>
<body>
    <h2>Search a Pokémon:</h2>
    <input type="text" placeholder="Enter a Pokemon" id="pokeField">
    <button onclick="SearchPokemon()">Find</button>

    <template id="pokemonTemplate">
        <div class="pokeResult">
            <h2 class="name">Pokemon</h2>
            <img class="sprite">
            <p class="height">Height</p>
            <p class="weight">Weight</p>
        </div>
    </template>

    <div id="pokeArea">
    </div>
</body>
</html>

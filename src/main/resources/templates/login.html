<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>PokeAPI - Login</title>
    <style>
        body {
        font-family: Arial,
        sans-serif;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        background-color: #f4f4f9; }

        .login-box {
        background: white;
        padding: 30px;
        border-radius: 8px;
        box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        text-align: center; }

        input {
        display: block;
        width: 100%;
        margin: 10px 0;
        padding: 10px;
        border: 1px solid #ccc;
        border-radius: 4px;
        box-sizing: border-box; }

        button {
        width: 100%;
        padding: 10px;
        background: #e3350d;
        color: white;
        border: none;
        border-radius: 4px;
        cursor: pointer;
        font-weight: bold; }

        button:hover { background: #b32a0a; }

        .error { color: red; font-size: 0.9em; margin-bottom: 10px; }
    </style>
</head>
<body>

<div class="login-box">
    <h2>Login PokeAPI</h2>

    <div th:if="${param.error}" class="error">
        Name or password incorrect.
    </div>

    <div th:if="${param.logout}" style="color: green; margin-bottom: 10px;">
        Session finished.
    </div>

    <div th:if="${param.registered}" style="color: green; margin-bottom: 10px;">
        Account created successfully!
    </div>

    <form th:action="@{/login}" method="post">
        <label>
            <input type="text" name="username" placeholder="Username" required />
        </label>
        <label>
            <input type="password" name="password" placeholder="Password" required />
        </label>

        <button type="submit">Enter</button>

        <p style="margin-top: 15px; font-size: 0.9em;">
            Doesn't have an account?
            <a th:href="@{/register}" style="color: #e3350d; text-decoration: none; font-weight: bold;">Register here</a>
        </p>
    </form>
</div>

</body>
</html>

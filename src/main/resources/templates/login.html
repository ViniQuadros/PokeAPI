<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>PokeAPI - Login</title>
    <link rel="stylesheet" th:href="@{/css/login.css}">
    <link rel="icon" type="image/png" th:href="@{/images/icon_pokeball.png}">

</head>
<body>
<div class="container">

    <div class="img-column">
    </div>

    <div class="form-column">
        <div class="login-box">
            <h2>Login PokeAPI</h2>

            <div th:if="${param.error}" class="error">
                Name or password incorrect.
            </div>

            <div th:if="${param.logout}" style="color: green; margin-bottom: 10px;">
                Session finished.
            </div>

            <div th:if="${param.registered}" style="color: green; margin-bottom: 10px;">
                Account created successfully!
            </div>

            <form th:action="@{/login}" method="post">
                <label>
                    <input type="text" name="username" placeholder="Username" required />
                </label>
                <label>
                    <input type="password" name="password" placeholder="Password" required />
                </label>

                <button type="submit">Enter</button>

                <p class="register-p">
                    Doesn't have an account?
                    <a th:href="@{/register}">Register here</a>
                </p>

            </form>
        </div>
    </div>
</div>
</body>
</html>

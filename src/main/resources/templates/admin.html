<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>PokeAPI - Painel Admin</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; background-color: #f4f4f9; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; background: white; }
        th, td { padding: 12px; border: 1px solid #ccc; text-align: left; }
        th { background-color: #2a75bb; color: white; }
        .btn-delete { background-color: #e3350d; color: white; border: none; padding: 8px 12px; cursor: pointer; border-radius: 4px; }
        .btn-delete:hover { background-color: #b32a0a; }
    </style>
</head>
<body>

<h2>Administration Panel</h2>
<p>All users</p>

<table>
    <thead>
    <tr>
        <th>ID</th>
        <th>Username</th>
        <th>Actions</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="user : ${users}">
        <td th:text="${user.id}"></td>
        <td th:text="${user.username}"></td>
        <td>
            <form th:if="${user.username != 'admin'}"
                  th:action="@{/admin/users/delete/{id}(id=${user.id})}"
                  method="post">
                <button type="submit" class="btn-delete">Delete</button>
            </form>

            <span th:if="${user.username == 'admin'}" style="color: gray; font-style: italic;">
                        Protected
                    </span>
        </td>
    </tr>
    </tbody>
</table>

<br>
<a th:href="@{/login}">Back to login</a>

</body>
</html>

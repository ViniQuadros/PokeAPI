<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>PokeAPI - Register</title>
    <style>
        body { font-family: Arial, sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; background-color: #f4f4f9; }
        .login-box { background: white; padding: 30px; border-radius: 8px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); text-align: center; }
        input { display: block; width: 100%; margin: 10px 0; padding: 10px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box;}
        button { width: 100%; padding: 10px; background: #2a75bb; color: white; border: none; border-radius: 4px; cursor: pointer; font-weight: bold;}
        button:hover { background: #1f5a92; }
    </style>
</head>
<body>

<div class="login-box">
    <h2>Create a new account</h2>

    <div th:if="${erro}" style="color: red; font-size: 0.9em; margin-bottom: 10px;">
        <span th:text="${erro}"></span>
    </div>

    <form th:action="@{/register}" method="post">
        <label>
            <input type="text" name="username" placeholder="Insert a username" required />
        </label>
        <label>
            <input type="password" name="password" placeholder="Create a password" required />
        </label>

        <button type="submit">Register</button>

        <p style="margin-top: 15px; font-size: 0.9em;">
            Already have an account?
            <a th:href="@{/login}" style="color: #2a75bb; text-decoration: none; font-weight: bold;">Login</a>
        </p>
    </form>
</div>

</body>
</html>
